<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pouch — group money, sorted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --ink:#1B1033;
    --butter:#FFF6DD;
    --paper:#FFFFFF;
    --grape:#6C4EF5;
    --grape-dark:#4F31D6;
    --grape-tint:#EEE9FF;
    --guava:#FF5D73;
    --guava-dark:#D93A52;
    --guava-tint:#FFE6E9;
    --mint:#18B884;
    --mint-tint:#DEFBEF;
    --sun:#B8860B;
    --sun-fill:#FFC93C;
    --sun-tint:#FFF3D6;
    --muted:#6E6482;
    --line:#1B1033;
    --radius:20px;
    --shadow-hard: 4px 4px 0 var(--ink);
    /* subtle ledger row tints */
    --lc-bg:#EAFBEF; --lc-border:#8FE3AC;
    --lw-bg:#FFEEF0; --lw-border:#FFA7B3;
    --lb-bg:#F1ECFF; --lb-border:#B9A4FF;
    --lr-bg:#FFF7E0; --lr-border:#FFCE5C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--butter);
    color:var(--ink);
    font-family:'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:88px;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:16px;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 16px;}

  .banner{
    background:var(--sun-fill); border-bottom:2.5px solid var(--ink);
    padding:10px 16px; font-size:13px; font-weight:600; text-align:center;
  }
  .banner a{color:var(--ink);}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 16px 8px;
    max-width:1180px; margin:0 auto;
  }
  .brand{display:flex; align-items:center; gap:8px;}
  .brand-mark{
    width:36px;height:36px;border-radius:11px;background:var(--grape);
    display:flex;align-items:center;justify-content:center;
    font-size:19px; transform:rotate(-6deg);
    border:2.5px solid var(--ink);
  }
  .brand-name{font-size:21px;}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);
    background:var(--paper); display:flex;align-items:center;justify-content:center;
    font-size:16px;
  }
  .icon-btn:active{transform:translateY(1px);}
  .top-actions{display:flex; gap:8px; align-items:center;}
  .profile-chip{
    display:flex; align-items:center; gap:6px; border:2px solid var(--ink); border-radius:30px;
    padding:5px 12px 5px 5px; background:var(--paper); font-weight:700; font-size:13px;
  }
  .profile-chip .pav{width:26px;height:26px;border-radius:50%;background:var(--mint-tint); display:flex;align-items:center;justify-content:center; font-size:13px; border:1.5px solid var(--ink);}

  .btn{
    border:2.5px solid var(--ink); border-radius:14px; padding:12px 18px;
    font-weight:700; font-size:15px; background:var(--paper); color:var(--ink);
    box-shadow:var(--shadow-hard); transition:transform .08s ease;
  }
  .btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .btn-block{width:100%; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn-grape{background:var(--grape); color:#fff;}
  .btn-guava{background:var(--guava); color:#fff;}
  .btn-mint{background:var(--mint); color:#fff;}
  .btn-sun{background:var(--sun-fill); color:var(--ink);}
  .btn-ghost{background:transparent; box-shadow:none;}
  .btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none; transform:none;}
  .btn-sm{padding:8px 12px; font-size:13px; border-radius:10px; box-shadow:none;}

  .card{
    background:var(--paper); border:2.5px solid var(--ink); border-radius:var(--radius);
    box-shadow:var(--shadow-hard); padding:18px;
  }
  .sticker{ transform:rotate(-0.6deg); }
  .sticker:nth-child(even){ transform:rotate(0.5deg); }

  .hero-empty{ text-align:left; padding:26px 20px; margin:14px 0 20px; }
  .hero-empty p{color:var(--muted); font-size:15px; line-height:1.5; margin:8px 0 18px;}
  .home-actions{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:26px;}
  .group-list{display:grid; gap:12px; grid-template-columns:1fr;}
  @media (min-width:640px){ .group-list{grid-template-columns:1fr 1fr;} }
  .group-card{
    display:flex; align-items:center; gap:14px; padding:16px; cursor:pointer;
    text-align:left; width:100%;
  }
  .group-emoji{
    width:48px;height:48px;border-radius:14px;background:var(--grape-tint);
    display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;
    border:2px solid var(--ink);
  }
  .group-card .meta{flex:1; min-width:0;}
  .group-card .g-name{font-family:'Space Grotesk'; font-weight:700; font-size:17px;}
  .group-card .g-sub{font-size:13px; color:var(--muted); margin-top:2px;}
  .group-card .g-balance{font-family:'Space Grotesk'; font-weight:700; font-size:18px;}
  .tag{
    display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px;
    border:1.5px solid var(--ink); margin-left:6px; vertical-align:middle;
  }

  .group-head{ display:flex; align-items:center; gap:12px; margin:6px 0 18px; flex-wrap:wrap; }
  .group-head .g-title{font-size:24px;}
  .code-chip{
    font-family:'Space Grotesk'; font-weight:700; letter-spacing:.06em;
    background:var(--grape-tint); border:2px solid var(--ink); border-radius:10px;
    padding:7px 12px; font-size:13px; display:inline-flex; align-items:center; gap:6px;
  }
  .hero-balance{ padding:26px 22px; margin-bottom:16px; }
  .hero-balance .label{font-size:14px; color:var(--muted); font-weight:600;}
  .hero-balance .amount{font-size:clamp(38px,8vw,56px); line-height:1.05; margin-top:4px;}
  .action-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px; }
  .action-card{
    border:2.5px solid var(--ink); border-radius:16px; padding:16px 14px;
    display:flex; flex-direction:column; align-items:flex-start; gap:6px;
    box-shadow:var(--shadow-hard); text-align:left;
  }
  .action-card .a-emoji{font-size:22px;}
  .action-card .a-title{font-family:'Space Grotesk'; font-weight:700; font-size:15px;}
  .action-card .a-sub{font-size:12px; opacity:.85;}
  .action-add{background:var(--mint-tint);}
  .action-out{background:var(--guava-tint);}
  .action-borrow{background:var(--grape-tint);}
  .action-repay{background:var(--sun-tint);}

  .section-title{font-size:19px; margin:22px 0 12px; display:flex; align-items:center; justify-content:space-between;}
  .section-title .add-mini{font-size:13px;}

  .members-grid{display:grid; gap:10px; grid-template-columns:1fr;}
  .member-card{padding:14px 16px;}
  .member-top{display:flex; align-items:center; gap:10px;}
  .m-emoji{width:38px;height:38px;border-radius:50%;background:var(--butter); border:2px solid var(--ink); display:flex;align-items:center;justify-content:center;font-size:18px;}
  .m-name{font-family:'Space Grotesk'; font-weight:700; font-size:16px;}
  .m-stats{display:flex; gap:14px; margin-top:10px; flex-wrap:wrap;}
  .m-stat{font-size:12px;}
  .m-stat .val{font-family:'Space Grotesk'; font-weight:700; font-size:15px; display:block;}
  .owe-badge{
    margin-top:10px; display:inline-block; font-size:12px; font-weight:700; padding:5px 10px;
    border-radius:20px; border:1.5px solid var(--ink);
  }
  .owe-yes{background:var(--sun-tint); color:var(--sun);}
  .owe-no{background:var(--mint-tint); color:var(--mint);}

  .filter-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;}
  .chip{
    flex-shrink:0; border:2px solid var(--ink); border-radius:20px; padding:6px 13px; font-size:13px;
    font-weight:600; background:var(--paper);
  }
  .chip.active{background:var(--ink); color:var(--butter);}

  .ledger-list{display:flex; flex-direction:column; gap:8px;}
  .ledger-row{
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:14px;
    border:2px solid var(--ink); background:var(--paper);
    border-left-width:6px;
  }
  .ledger-row.contribution{background:var(--lc-bg); border-left-color:var(--lc-border);}
  .ledger-row.withdrawal{background:var(--lw-bg); border-left-color:var(--lw-border);}
  .ledger-row.borrow{background:var(--lb-bg); border-left-color:var(--lb-border);}
  .ledger-row.repayment{background:var(--lr-bg); border-left-color:var(--lr-border);}
  .l-icon{
    width:36px;height:36px;border-radius:10px; display:flex;align-items:center;justify-content:center;
    font-size:16px; flex-shrink:0; border:2px solid var(--ink); background:var(--paper);
  }
  .l-mid{flex:1; min-width:0;}
  .l-title{font-weight:700; font-size:14px;}
  .l-sub{font-size:12px; color:var(--muted); margin-top:1px;}
  .l-amount{font-family:'Space Grotesk'; font-weight:700; font-size:15px; white-space:nowrap;}

  .empty-note{
    text-align:center; color:var(--muted); font-size:13px; padding:22px 10px;
    border:2px dashed var(--ink); border-radius:14px;
  }

  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; background:var(--paper);
    border-top:2.5px solid var(--ink); display:flex; z-index:40;
  }
  .nav-btn{
    flex:1; background:none; border:none; padding:10px 4px 8px; display:flex; flex-direction:column;
    align-items:center; gap:2px; font-size:11px; font-weight:700; color:var(--muted);
  }
  .nav-btn.active{color:var(--ink);}
  .nav-btn .n-icon{font-size:19px;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(27,16,51,.55); display:flex; align-items:flex-end;
    justify-content:center; z-index:100; padding:0;
  }
  @media (min-width:640px){ .modal-overlay{align-items:center; padding:20px;} }
  .modal-card{
    background:var(--paper); border:2.5px solid var(--ink); width:100%; max-width:440px;
    border-radius:22px 22px 0 0; padding:22px 20px 26px; max-height:92vh; overflow-y:auto;
    box-shadow:0 -4px 0 var(--ink);
  }
  @media (min-width:640px){ .modal-card{border-radius:22px; box-shadow:var(--shadow-hard);} }
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; padding:12px 13px; border:2px solid var(--ink); border-radius:12px; background:var(--butter);
  }
  .field textarea{resize:vertical; min-height:56px;}
  .amount-input{display:flex; align-items:center; border:2px solid var(--ink); border-radius:12px; background:var(--butter); overflow:hidden;}
  .amount-input span{padding-left:12px;font-weight:700;}
  .amount-input input{border:none; background:transparent; flex:1;}
  .emoji-pick{display:flex; flex-wrap:wrap; gap:6px;}
  .emoji-opt{width:40px;height:40px;border-radius:10px;border:2px solid var(--ink); background:var(--butter); font-size:18px;}
  .emoji-opt.sel{background:var(--grape); }
  .hint{font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.4;}
  .hint.warn{color:var(--guava-dark); font-weight:600;}
  .hint.ok{color:var(--mint); font-weight:600;}
  .link-box{
    display:flex; align-items:center; gap:8px; background:var(--butter); border:2px solid var(--ink);
    border-radius:12px; padding:10px 12px; font-size:13px; word-break:break-all; margin:10px 0;
  }
  #toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--butter); padding:11px 18px; border-radius:30px;
    font-size:13px; font-weight:600; z-index:200; opacity:0; pointer-events:none; transition:all .25s ease;
    white-space:nowrap; max-width:90vw; overflow:hidden; text-overflow:ellipsis;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .tab-section{display:none;}
  .tab-section.active{display:block;}
  @media (min-width:900px){
    .bottom-nav{display:none;}
    body{padding-bottom:40px;}
    .group-main{ display:grid; grid-template-columns:300px 1fr; gap:22px; align-items:start; }
    #sec-members{grid-column:1; grid-row:1/3;}
    #sec-overview{grid-column:2; grid-row:1;}
    #sec-ledger{grid-column:2; grid-row:2;}
    .tab-section, .tab-section.active{display:block;}
    .members-grid{grid-template-columns:1fr;}
  }
  .about-body{font-size:14px; line-height:1.6;}
  .about-body b{font-family:'Space Grotesk';}
  .center-screen{ min-height:80vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .onboard-card{max-width:420px; width:100%;}
  .code-reveal{
    text-align:center; font-family:'Space Grotesk'; font-weight:700; font-size:28px;
    letter-spacing:.08em; background:var(--grape-tint); border:2px solid var(--ink); border-radius:14px;
    padding:16px; margin:14px 0;
  }
  table.admin-table{width:100%; border-collapse:collapse; font-size:13px; margin-top:10px;}
  table.admin-table th, table.admin-table td{ text-align:left; padding:8px 10px; border-bottom:1.5px solid #e5dfc9; }
  table.admin-table th{font-family:'Space Grotesk'; font-size:12px; color:var(--muted);}
  .admin-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:18px;}
  .admin-stat{padding:14px;}
  .admin-stat .n{font-family:'Space Grotesk'; font-weight:700; font-size:26px;}
  .admin-stat .l{font-size:12px; color:var(--muted);}
</style>
</head>
<body>
<div id="bannerRoot"></div>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toast"></div>

<script>
/* ============================================================
   POUCH — standalone group savings tracker
   No AI dependency. Data lives in Firestore (if configured)
   or in this browser's local storage as a fallback.
   ============================================================ */

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBqPCpgOdHUfjo-FTcffUTLpytEClPxDEU",
  authDomain: "pouch-ai.firebaseapp.com",
  projectId: "pouch-ai",
  storageBucket: "pouch-ai.firebasestorage.app",
  messagingSenderId: "1086780114302",
  appId: "1:1086780114302:web:f4646637063f61bbda9f2f"
};

/* Set this to the email you'll use for the ONE admin account.
   Create that account in Firebase console > Authentication > Add user,
   and mirror this exact email in your Firestore rules (see setup notes). */
const ADMIN_EMAIL = "puneetnagula844@gmail.com";

const EMOJIS = ['💸','🐷','🧾','🌱','🍩','🦄','🔥','🎯','🧡','🪄','🌈','🐙','🍉','🎈','🧃','🐝'];
const CURRENCIES = ['₹','$','€','£','¥','₦','R'];
const TYPE_META = {
  contribution:{label:'Added money', icon:'💰', class:'contribution', verb:'added'},
  withdrawal:{label:'Took money out', icon:'🧾', class:'withdrawal', verb:'took out'},
  borrow:{label:'Borrowed', icon:'🙋', class:'borrow', verb:'borrowed'},
  repayment:{label:'Paid back', icon:'✅', class:'repayment', verb:'paid back'},
};

let STATE = {
  screen:'boot', homeGroups:[], homeLoading:true,
  currentPtr:null, groupData:null,
  tab:'overview', ledgerFilter:'all',
  myProfile:null,
  adminUsers:[], adminGroups:[], adminLoading:false,
};
let STORAGE_MODE = 'local'; // 'firebase' | 'local'
let db = null;

/* ---------------- storage backend (generic, works for any "collection") ---------------- */
function initFirebase(){
  try{
    if(!window.firebase || !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf('YOUR_')===0){
      return false;
    }
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    return true;
  }catch(e){ console.error('Firebase init failed', e); return false; }
}
async function docGet(collection, id){
  if(STORAGE_MODE==='firebase'){
    try{ const doc = await db.collection(collection).doc(id).get(); return doc.exists ? doc.data() : null; }
    catch(e){ console.error(e); return null; }
  }
  try{ const raw = localStorage.getItem('pouch-'+collection+'-'+id); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
async function docSet(collection, id, data){
  if(STORAGE_MODE==='firebase'){
    try{ await db.collection(collection).doc(id).set(data); return true; }
    catch(e){ console.error(e); toast('Could not save — check your connection'); return false; }
  }
  try{ localStorage.setItem('pouch-'+collection+'-'+id, JSON.stringify(data)); return true; }
  catch(e){ return false; }
}
async function collectionListAll(collection){
  if(STORAGE_MODE!=='firebase') return null;
  try{ const snap = await db.collection(collection).get(); return snap.docs.map(d=>({id:d.id, ...d.data()})); }
  catch(e){ console.error(e); return null; }
}
function loadRecents(){ try{ return JSON.parse(localStorage.getItem('pouch-recents')||'[]'); }catch(e){ return []; } }
function saveRecents(arr){ try{ localStorage.setItem('pouch-recents', JSON.stringify(arr)); }catch(e){} }
function addRecent(code, name, emoji){
  let r = loadRecents().filter(g=>g.code!==code);
  r.unshift({code, name, emoji, ts:Date.now()});
  saveRecents(r.slice(0,30));
}

function uid(){ return Math.random().toString(36).slice(2,10); }
function genCode(){
  const chars='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<6;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function genUserCode(){
  const chars='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let c='U'; for(let i=0;i<7;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmt(n, cur){
  const v = Math.round((n + Number.EPSILON) * 100) / 100;
  return cur + v.toLocaleString(undefined,{minimumFractionDigits: v%1?2:0, maximumFractionDigits:2});
}
function parseAmt(str){
  const n = parseFloat(str);
  if(isNaN(n) || n<=0) return null;
  return Math.round(n*100)/100;
}
function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}
function shareUrl(code){
  const base = location.origin + location.pathname;
  return base + '?g=' + code;
}

/* ---------------- derived stats ---------------- */
function memberStats(data, memberId){
  let contributed=0, withdrawn=0, borrowed=0, repaid=0;
  for(const t of data.txns){
    if(t.memberId!==memberId) continue;
    if(t.type==='contribution') contributed+=t.amount;
    else if(t.type==='withdrawal') withdrawn+=t.amount;
    else if(t.type==='borrow') borrowed+=t.amount;
    else if(t.type==='repayment') repaid+=t.amount;
  }
  const available = Math.max(0, round2(contributed-withdrawn));
  const outstanding = Math.max(0, round2(borrowed-repaid));
  return {contributed:round2(contributed), withdrawn:round2(withdrawn), borrowed:round2(borrowed), repaid:round2(repaid), available, outstanding};
}
function poolCash(data){
  let cash=0;
  for(const t of data.txns){
    if(t.type==='contribution') cash+=t.amount;
    else if(t.type==='withdrawal') cash-=t.amount;
    else if(t.type==='borrow') cash-=t.amount;
    else if(t.type==='repayment') cash+=t.amount;
  }
  return round2(cash);
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  if(STATE.screen==='onboarding') app.innerHTML = renderOnboardingHTML();
  else if(STATE.screen==='home') app.innerHTML = renderHomeHTML();
  else if(STATE.screen==='group') app.innerHTML = renderGroupHTML();
  else if(STATE.screen==='admin-login') app.innerHTML = renderAdminLoginHTML();
  else if(STATE.screen==='admin-dashboard') app.innerHTML = renderAdminDashboardHTML();
  else app.innerHTML = '';
}
function renderBanner(){
  const el = document.getElementById('bannerRoot');
  if(STORAGE_MODE==='local'){
    el.innerHTML = `<div class="banner">Running in local-only mode — groups & profiles stay on this device.</div>`;
  } else { el.innerHTML=''; }
}

/* ---------------- ONBOARDING (profile gate) ---------------- */
function renderOnboardingHTML(){
  return `
    <div class="center-screen">
      <div class="card onboard-card">
        <div class="brand" style="margin-bottom:14px;">
          <div class="brand-mark">🪙</div><div class="brand-name display">Pouch</div>
        </div>

async function submitOnboarding(){
  const name = document.getElementById('obName').value.trim();
  const phone = document.getElementById('obPhone').value.trim();
  const referredBy = document.getElementById('obRef').value.trim();
  if(!name || !phone){ toast('Name and phone are required'); return; }
  let code = genUserCode();
  if(STORAGE_MODE==='firebase'){
    for(let i=0;i<5;i++){ const exists = await docGet('users', code); if(!exists) break; code = genUserCode(); }
  }
  const profile = { name, phone, referredBy, code, createdAt: Date.now() };
  await docSet('users', code, profile);
  try{ localStorage.setItem('pouch-my-profile', JSON.stringify(profile)); }catch(e){}
  STATE.myProfile = profile;
  showCodeReveal(profile);
}
function showCodeReveal(profile){
  const inner = `
    <p class="hint">This code is yours — it's how the app tells you apart from anyone with the same name.</p>
    <div class="code-reveal">${profile.code}</div>
    <button class="btn btn-grape btn-block" onclick="App.closeModal(); App.continueBootAfterProfile();">Let's go</button>
  `;
  openModal(modalShell('You\'re set, '+profile.name.split(' ')[0]+' 🎉', inner));
}

function goAdmin(){
  if(STORAGE_MODE!=='firebase'){ STATE.screen='admin-login'; render(); return; }
  const cur = firebase.auth().currentUser;
  if(cur && cur.email===ADMIN_EMAIL){ loadAdminDashboard(); }
  else { STATE.screen='admin-login'; render(); }
}
async function submitAdminLogin(){
  const email = document.getElementById('adEmail').value.trim();
  const pass = document.getElementById('adPass').value;
  if(!email || !pass){ toast('Enter email and password'); return; }
  try{
    const cred = await firebase.auth().signInWithEmailAndPassword(email, pass);
    if(cred.user.email !== ADMIN_EMAIL){
      toast('That account is not the admin account');
      await firebase.auth().signOut();
      return;
    }
    await loadAdminDashboard();
  }catch(e){ toast(e.message || 'Sign in failed'); }
}
async function loadAdminDashboard(){
  STATE.screen='admin-dashboard'; STATE.adminLoading=true; render();
  const [users, groups] = await Promise.all([collectionListAll('users'), collectionListAll('groups')]);
  STATE.adminUsers = users||[]; STATE.adminGroups = groups||[]; STATE.adminLoading=false;
  render();
}
async function adminSignOut(){
  if(STORAGE_MODE==='firebase'){ try{ await firebase.auth().signOut(); }catch(e){} }
  goHome();
}

    <div id="txHint"></div>
    <div class="field" style="margin-top:14px;"><label>Note (optional)</label><input id="txNote" type="text" placeholder="e.g. for weekend rent" maxlength="60" /></div>
    <button class="btn ${type==='withdrawal'?'btn-guava':type==='borrow'?'btn-grape':type==='repayment'?'btn-sun':'btn-mint'} btn-block" style="margin-top:6px;" id="txSubmitBtn" onclick="App.submitTxn('${type}')">${titles[type]}</button>
  `;
  openModal(modalShell(titles[type], inner));
  refreshTxnHint(type);
}
function refreshTxnHint(forcedType){
  const data = STATE.groupData;
  const memberSel = document.getElementById('txMember');
  const amountEl = document.getElementById('txAmount');
  const hintEl = document.getElementById('txHint');
  const btn = document.getElementById('txSubmitBtn');
  if(!memberSel || !amountEl) return;
  const t = forcedType || btn.dataset.type;
  btn.dataset.type = t;
  const st = memberStats(data, memberSel.value);
  const cash = poolCash(data);
  const amt = parseFloat(amountEl.value) || 0;
  let hint='', ok=true;
  if(t==='contribution'){
    hint = `Adding this will bring their own money in the pot to ${fmt(round2(st.available+amt), data.currency)}.`;
  } else if(t==='withdrawal'){
    hint = `They've got ${fmt(st.available, data.currency)} of their own in the pot.`;
    if(amt > st.available){ hint += ` That's more than they've put in — use <b>Borrow</b> instead for the extra.`; ok=false; }
    else if(amt > cash){ hint += ` The pot only physically holds ${fmt(cash, data.currency)} right now.`; ok=false; }
  } else if(t==='borrow'){
    hint = `The pot has ${fmt(cash, data.currency)} available to lend. `;
    if(st.outstanding>0) hint += `They already owe ${fmt(st.outstanding, data.currency)}. `;
    if(amt > cash){ hint += `That's more than the pot has right now.`; ok=false; }
  } else if(t==='repayment'){
    if(st.outstanding<=0){ hint = `They don't owe anything right now — nothing to pay back.`; ok=false; }
    else { hint = `They owe ${fmt(st.outstanding, data.currency)}.`; if(amt > st.outstanding){ hint += ` You can pay back at most that much.`; ok=false; } }
  }
  hintEl.innerHTML = `<div class="hint ${ok?'':'warn'}">${hint}</div>`;
  btn.disabled = amt<=0 ? false : !ok;
}
async function submitTxn(type){
  const data = STATE.groupData;
  const memberId = document.getElementById('txMember').value;
  const amount = parseAmt(document.getElementById('txAmount').value);
  const note = document.getElementById('txNote').value.trim().slice(0,60);
  if(!amount){ toast('Enter an amount'); return; }
  const st = memberStats(data, memberId);
  const cash = poolCash(data);
  if(type==='withdrawal'){
    if(amount > st.available){ toast("That's more than they've put in — try Borrow"); return; }
    if(amount > cash){ toast('The pot doesn\'t have that much cash right now'); return; }
  } else if(type==='borrow'){
    if(amount > cash){ toast('The pot doesn\'t have that much cash right now'); return; }
  } else if(type==='repayment'){
    if(st.outstanding<=0){ toast('Nothing owed — nothing to pay back'); return; }
    if(amount > st.outstanding){ toast('That\'s more than they owe'); return; }
  }
  data.txns.push({ id:uid(), memberId, type, amount, note, ts: Date.now() });
  await docSet('groups', STATE.currentPtr.code, data);
  closeModal(); toast(TYPE_META[type].label+' ✓'); render();
}

function showAbout(){
  const inner = `
    <div class="about-body">
      <p><b>Storage mode: ${STORAGE_MODE==='firebase' ? 'Cloud (Firebase) — cross-device sharing is on.' : 'Local only — groups stay on this browser/device.'}</b></p>
      <p><b>Withdraw vs. Borrow.</b> "Take money out" only ever lets someone take out money they've actually put in. Taking more than that always goes through the separate "Borrow" action, so borrowed money is never mixed up with someone's own contributions.</p>
      <p><b>Ledger records can't be deleted</b> once added, so the history stays trustworthy for everyone in the group. If something's wrong, add a correcting entry with a note.</p>
      <p><b>Your profile code</b> keeps you distinct from anyone sharing your name — it's yours across every group.</p>
      <p style="color:var(--muted);">There's no login for groups themselves, so anyone with a group's link/code can view and add to it — treat sharing it like sharing a password. Built for casual group funds among people who trust each other.</p>
    </div>
    <button class="btn btn-block" style="margin-top:16px;" onclick="App.closeModal()">Got it</button>
  `;
  openModal(modalShell('About Pouch', inner));
}

/* ============================================================ NAV ============================================================ */
async function goHome(){
  STATE.screen='home'; STATE.homeLoading=true; render();
  const recents = loadRecents();
  const results = await Promise.all(recents.map(async r=>({code:r.code, name:r.name, data: await docGet('groups', r.code)})));
  STATE.homeGroups = results.filter(r=>r.data);
  STATE.homeLoading = false; render();
}
async function openGroup(code){
  const data = await docGet('groups', code);
  if(!data){ toast("Can't find a group with that code"); if(STATE.screen!=='group') goHome(); return; }
  STATE.currentPtr = {code}; STATE.groupData = data;
  STATE.screen='group'; STATE.tab='overview'; STATE.ledgerFilter='all';
  addRecent(code, data.name, data.emoji);
  render();
}
async function refreshGroup(){
  const data = await docGet('groups', STATE.currentPtr.code);
  if(data){ STATE.groupData = data; render(); toast('Refreshed'); }
}
function setTab(tab){ STATE.tab = tab; render(); }
function setLedgerFilter(f){ STATE.ledgerFilter = f; render(); }

async function continueBootAfterProfile(){
  const params = new URLSearchParams(location.search);
  const g = params.get('g');
  if(g){ await openGroup(g.toUpperCase()); }
  else { await goHome(); }
}

window.App = {
  showCreateGroup, showJoinGroup, showAddMember, showAbout, showShare, copyLink, nativeShare,
  pickEmoji, submitCreateGroup, submitJoinGroup, submitAddMember,
  openTxnModal, refreshTxnHint, submitTxn,
  closeModal, goHome, openGroup, refreshGroup, setTab, setLedgerFilter,
  submitOnboarding, continueBootAfterProfile, showMyProfile, saveMyProfile,
  goAdmin, submitAdminLogin, adminSignOut,
};

/* ---------------- boot ---------------- */
(async function boot(){
  STORAGE_MODE = initFirebase() ? 'firebase' : 'local';
  renderBanner();
  const params = new URLSearchParams(location.search);
  if(params.get('admin')==='1'){
    goAdmin();
    return;
  }
  let profile = null;
  try{ profile = JSON.parse(localStorage.getItem('pouch-my-profile')||'null'); }catch(e){}
  if(profile && profile.code){
    STATE.myProfile = profile;
    await continueBootAfterProfile();
  } else {
    STATE.screen = 'onboarding';
    render();
  }
})();
</script>
